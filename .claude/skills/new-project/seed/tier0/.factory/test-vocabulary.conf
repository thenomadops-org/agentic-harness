# .factory/test-vocabulary.conf — what this repo calls a test, and what it
# calls an assertion.
#
# THIS IS GATE CONFIG. It is on the read-only list in
# ../docs/AGENT-GUARDRAILS.md. Widening TEST_* makes fewer files count as tests;
# narrowing ASSERT_* makes fewer things count as assertions. Either one makes
# `.claude/hooks/block-test-weakening.sh` quieter without anybody deciding to
# make it quieter, which is the exact move that document exists to stop. If this
# file is the thing standing between you and a green build, the gate is working.
#
# THIS IS THE ONE .factory/ FILE THE INSTALL COPIES rather than writing from the
# interview, and the reason is worth stating: a vocabulary shipped empty makes
# the hook match nothing, and a hook that matches nothing reports the same
# reassuring answer as a hook that looked and found nothing wrong. A starting
# vocabulary somebody has to prune is strictly better than a vacuous one.
#
# SO PRUNE IT AT INSTALL. Delete the languages this repo does not use. A pattern
# for a language nobody writes here is not harmless — it is a line a future
# reader will believe was measured.
#
# Sourced by bash. Every value is a POSIX extended regular expression (ERE),
# because the hook hands them to `grep -E`. Keep them POSIX: `[[:space:]]`, not
# `\s`.

# --- what counts as a test file --------------------------------------------
# Matched against the repo-relative path. Name-based first.
#   _test.go     Go            *.test.ts/tsx/js   JS/TS
#   *Test.kt     Kotlin/JVM    *Test.swift        Swift/XCTest
#   *.test.sh    shell suites  test_*.py / *_test.py  Python
TEST_NAME_RE='(_test\.go|\.test\.sh|\.test\.ts|\.test\.tsx|\.test\.js|Test\.kt|Tests\.kt|Test\.java|Test\.swift|Tests\.swift|_test\.py|\.test\.sql)$'

# Basename shapes that the suffix rule above cannot express.
TEST_BASENAME_RE='(^|/)test_[^/]*\.py$'

# Source-set directories. The JVM/KMP list is long because Kotlin Multiplatform
# has one per target; delete the targets this repo does not build.
TEST_DIR_RE='(^|/)(src/(test|androidTest|commonTest|androidUnitTest|iosTest|jvmTest|nativeTest|integrationTest)|tests?)/'

# --- what counts as an assertion --------------------------------------------
# Two families, summed. Over-counting is harmless: the old side and the new side
# are counted by the identical rule and only the DIFFERENCE is read.
#
# 1. The assertion vocabulary of Go, Kotlin, Java, Swift, JS and C++.
ASSERT_RE='assert|Assert|ASSERT|XCTFail|t\.Error|t\.Fatal|require\.[A-Za-z]|EXPECT_|expect\('

# 2. Line-anchored helper vocabulary for shell suites. This one is genuinely
#    per-repo: it must name the helpers YOUR *.test.sh files call. The seed's
#    own suites use check/contains/not_contains/must_fail (see
#    ../scripts/gate-test-lib.sh). If your shell suites use different names and
#    you do not list them here, removing every assertion from a shell suite is
#    invisible to this hook.
SHELL_ASSERT_RE='^[[:space:]]*(check|contains|not_contains|must_fail)[[:space:]]'

# --- what counts as disabling a test ----------------------------------------
# Disabling a test is deleting it with extra steps, so introducing any of these
# is refused exactly like removing an assertion.
SKIP_RE='t\.Skip|@Ignore|@Disabled|XCTSkip|\.skip\(|xit\(|it\.skip|describe\.skip'

# --- the bypass -------------------------------------------------------------
# A test does genuinely become obsolete. When it has:
#
#     ALLOW_TEST_WEAKENING=<ticket> claude ...
#
# The bypass is deliberately ACCOUNTABLE rather than silent: the hook allows the
# call and tells the model, in the same breath, that the PR body now owes a line
# naming the test it removed and why. A bypass nobody has to account for is just
# a disabled hook.
#
# TICKET_RE must match the ticket keys that authorise work here. Keep it in step
# with .factory/ticket-prefixes — a bypass value that is not a real key is not a
# bypass, and that is the point.
TICKET_RE='^([A-Z][A-Z0-9]+-[0-9]+|GH-[0-9]+|gh-[0-9]+|#[0-9]+)'

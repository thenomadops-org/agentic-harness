# Name sets for the setup interview.
#
# Names are PRESENTATION. Nothing internal keys off them — see org/roles.yaml.
# A theme supplies names in order; setup maps them to the roles the user kept,
# in the tree order defined by roles.yaml (principal's direct reports first,
# then down each branch).
#
# Adding a theme is a pure data change. Requirements:
#   - at least 15 names, so a full org can be filled
#   - single word, ASCII, no spaces, distinct at a glance
#   - none in `reserved` below

version: 1

# Rejected regardless of theme. These collide with tools, paths, model names or
# the generated file layout, and the failure is confusing rather than loud.
reserved:
  - claude
  - agent
  - main
  - master
  - origin
  - head
  - git
  - gh
  - opus
  - sonnet
  - haiku
  - system
  - user
  - assistant
  - admin
  - root
  - test
  # Quoted deliberately: bare `null`/`true`/`false` parse as YAML literals, not
  # strings, and land in this list as None/True/False. Found by the validator
  # on the day this file was written.
  - "null"
  - "true"
  - "false"

# Enforced at setup regardless of source:
#   - unique, case-insensitively, across the whole org
#   - not equal to the principal's name
#   - matches ^[A-Z][a-z]{1,11}$
rules:
  pattern: "^[A-Z][a-z]{1,11}$"
  unique: true
  distinct_from_principal: true

themes:

  default:
    label: "Keep the defaults"
    description: "The names the source org actually uses. Chosen to be forgettable in a good way — short, distinct, no association to fight."
    names: [Joe, Bill, John, Tom, Sue, Nate, Vera, Jack, Kay, Rosa, Wes, Dana, Iris, Elle, Bob]

  role_ids:
    label: "No names — use role IDs"
    description: "For people who find named agents twee. Every agent is addressed by its role. Nothing else changes."
    names: []          # setup renders `chief-of-staff` etc. as the display name

  friends:
    label: "Friends"
    names: [Ross, Rachel, Monica, Chandler, Joey, Phoebe, Gunther, Janice, Richard, Mike, Emily, Carol, Susan, Estelle, Frank]

  singers:
    label: "Singers"
    names: [Aretha, Freddie, Stevie, Dolly, Bowie, Prince, Nina, Elton, Whitney, Marvin, Joni, Otis, Etta, Bono, Adele]

  greek:
    label: "Greek gods"
    names: [Athena, Apollo, Hermes, Artemis, Ares, Demeter, Hestia, Hades, Iris, Nyx, Pan, Rhea, Eos, Helios, Selene]

  scientists:
    label: "Scientists"
    names: [Ada, Curie, Turing, Hopper, Feynman, Bohr, Noether, Fermi, Franklin, Tesla, Darwin, Lovelace, Pasteur, Sagan, Hodgkin]

  norse:
    label: "Norse"
    names: [Odin, Frigg, Thor, Loki, Freya, Baldr, Tyr, Heimdall, Sif, Njord, Idun, Bragi, Vidar, Skadi, Hel]

  botanical:
    label: "Botanical"
    names: [Fern, Sage, Rowan, Hazel, Linden, Juniper, Willow, Aspen, Clover, Basil, Laurel, Olive, Cedar, Poppy, Yarrow]

# Custom is always offered: the user supplies one name per kept role, validated
# against `rules` and `reserved`. If a supplied name fails, setup says which name
# and which rule, and re-asks for that one only — it never silently substitutes.
custom:
  label: "I'll name them myself"

# ---------------------------------------------------------------------------
# Legibility
#
# A themed org trades role clarity for personality: "Chandler says the deploy is
# blocked" carries less information than "the ops lead says". Generated docs
# therefore ALWAYS render `Name (title)` on first mention in any file, and the
# role id stays in agent frontmatter regardless of theme.
#
# This is not configurable. The whole point of naming being cosmetic is that it
# cannot cost you the ability to tell who does what.
# ---------------------------------------------------------------------------

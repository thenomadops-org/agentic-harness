# Project file (portable-workforce spec F3). Validate with
#   python3 plugin/skills/onboard-project/validate.py
board_project: Agentic-OS
roles: [engineer, qa, product, engineering-lead, chief-of-staff, operations-lead]
test: python3 tools/check_public.py && python3 tools/test_miniyaml.py && python3 plugin/check_plugin.py . && python3 -m unittest discover -s plugin -p test_check_plugin.py && python3 -m unittest discover -s plugin/skills/onboard-project
build: python3 -m compileall -q tools plugin
staging:
  # No image is published from this tree. The agent-osd publish job was removed
  # in OPS-333. The harness rewrite is OPS-334.
  deploy: No image is published from this tree. The agent-osd publish job was removed in OPS-333. The harness rewrite is OPS-334.
  url: env:AGENT_OS_URL
  check: No running workload is moved by a merge to main.
production:
  # Staging and production are one environment today. The apply that moves a
  # workload is guarded. These substrings are what the production hook blocks.
  commands:
    - kubectl apply
    - kubectl set image
    - kubectl rollout
  same_environment_as_staging: true
